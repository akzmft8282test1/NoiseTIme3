name: noisetime
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  permission_handler: ^11.3.1
  noise_meter: ^5.0.2
  fl_chart: ^0.71.0
  firebase_messaging: ^16.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1 # 아이콘 런처 패키지 추가

flutter_launcher_icons:
  android: "launcher_icon" 
  ios: true
  image_path: "assets/icon/icon.png" # 아이콘 이미지 경로
  min_sdk_android: 21 # 안드로이드 최소 SDK 버전

flutter:
  uses-material-design: true

  assets:
   - assets/icon/ # 아이콘 폴더 asset 추가
